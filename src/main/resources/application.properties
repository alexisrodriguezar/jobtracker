spring.application.name=jobtracker

spring.datasource.url=jdbc:mysql://localhost:3306/jobtracker?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

llm.api-key=${GEMINI_API_KEY}
llm.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
llm.base-url=https://generativelanguage.googleapis.com/v1beta
llm.timeout-seconds=30
analisis.limite-diario-por-usuario=5
analisis.limite-diario-global=300